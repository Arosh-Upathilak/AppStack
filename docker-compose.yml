services:
  postgres:
    image: postgres:15-alpine
    container_name: appstack-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appstack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: appstack-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appstack-backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appstack?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
      JWT_SECRET: "${JWT_SECRET:-demo_super_secret_jwt_key_123}"
      FRONTEND_URL: "http://localhost:3000"
      # Optional — set these in ./.env to enable the register→OTP email flow.
      # Leave blank to demo on the seeded accounts (no email sent).
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      # Optional — set to enforce reCAPTCHA. Blank skips it (NODE_ENV != production).
      RECAPTCHA_SECRET_KEY: "${RECAPTCHA_SECRET_KEY:-}"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-simulator}"
    entrypoint: >
      sh -c "
        echo 'Waiting for postgres...' &&
        sleep 5 &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node dist/index.js
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time (see frontend/Dockerfile).
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:5001/api"
        NEXT_PUBLIC_API_SOCKET_BASE_URL: "http://localhost:5001"
        # Optional reCAPTCHA site key — blank disables the client widget.
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}"
    container_name: appstack-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_BASE_URL: "http://backend:5000/api"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-nextauth_demo_secret_key_987}"
      JWT_SECRET: "${JWT_SECRET:-demo_super_secret_jwt_key_123}"
      # Optional — set these in ./.env to enable Google sign-in.
      NEXT_GOOGLE_CLIENT_ID: "${NEXT_GOOGLE_CLIENT_ID:-}"
      NEXT_GOOGLE_CLIENT_SECRET: "${NEXT_GOOGLE_CLIENT_SECRET:-}"

volumes:
  pgdata:
