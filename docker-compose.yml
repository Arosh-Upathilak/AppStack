services:
  postgres:
    image: postgres:15-alpine
    container_name: appstack-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appstack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: appstack-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appstack-backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appstack?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
      JWT_SECRET: "demo_super_secret_jwt_key_123"
      FRONTEND_URL: "http://localhost:3000"
      EMAIL_USER: "test@example.com"
      EMAIL_PASS: "test"
    entrypoint: >
      sh -c "
        echo 'Waiting for postgres...' &&
        sleep 5 &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node dist/index.js
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:5001/api"
        NEXT_PUBLIC_API_SOCKET_BASE_URL: "http://localhost:5001"
    container_name: appstack-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:5001/api"
      NEXT_PUBLIC_API_SOCKET_BASE_URL: "http://localhost:5001"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "nextauth_demo_secret_key_987"
      JWT_SECRET: "demo_super_secret_jwt_key_123"

volumes:
  pgdata:
