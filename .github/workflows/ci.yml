name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    env:
      # Prisma needs a URL to generate the client; SQLite file path is enough
      # at build time since no queries run during `next build`.
      DATABASE_URL: "file:./dev.db"
      # NextAuth requires AUTH_SECRET at build time.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret-32chars-x' }}
      # Skip Prisma postinstall during `npm ci --ignore-scripts`; we run it
      # explicitly in the "Generate Prisma client" step below.
      PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
      # Bypass auth middleware so static analysis and lint see all routes.
      AUTH_BYPASS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build

  backend:
    name: Backend (Node + TS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
